name: CI

on:
  push:
    branches: [ "main", "feature/**", "chore/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la

      - name: Basic project check
        run: |
          echo "Running CI for CampusEats Task Tracker"
          test -f README.md && echo "README found"
          test -d frontend && test -d backend && echo "frontend and backend present"
          test -f backend/Dockerfile && echo "Dockerfile found"
          test -f frontend/public/_redirects && echo "Netlify redirects found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build backend
        working-directory: backend
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
